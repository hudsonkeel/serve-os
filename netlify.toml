[build]
  command = "npm run build"
  publish = ".next"
  # Raw Netlify Functions living alongside the Next.js app — today, the assessment processing
  # dispatcher/worker pair: assessment-processing-dispatcher.ts (scheduled, every 2 minutes,
  # dispatch-only — finds eligible work and hands it off) and
  # assessment-processing-stage-worker-background.ts (a Background Function, up to 15 minutes,
  # invoked by the dispatcher to perform exactly one bounded pipeline stage — never invoked on a
  # schedule itself). Split this way because Netlify Scheduled Functions have a hard 30-second
  # execution limit, too short for audio assembly/S3 staging/an AWS Transcribe or Bedrock call —
  # see docs/architecture/ASSESSMENT_TRANSCRIPTION_ORCHESTRATION.md. This is the default location
  # Netlify already discovers automatically; declared explicitly so it's unambiguous alongside
  # the Next.js runtime plugin's own internally-generated functions (which live in a separate,
  # plugin-managed location and never collide with this directory).
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secrets scanner treats every non-NEXT_PUBLIC_ env var as
  # sensitive by default and flags its literal value anywhere in the
  # deploy output — including safe, expected server-only SSR chunks
  # (.next/server/chunks/ssr/*), which it does not distinguish from the
  # browser-shipped client bundle (.next/static/*). Live-verified locally
  # (clean `next build`, grepping the actual output): AXISCARE_API_BASE_URL
  # and AXISCARE_SITE_NUMBER (the site number is embedded in the base
  # URL's hostname — see .env.example's AXISCARE_API_BASE_URL comment)
  # appear only in .next/server/chunks/ssr/*, never in .next/static/*, and
  # are read exclusively by lib/integrations/axiscare/config.ts, which is
  # `import "server-only"`-guarded (a Next.js build-time enforced
  # guarantee, not just a convention). Neither value is a credential — a
  # hostname and a numeric site ID, not a token/key. The real secrets
  # (AXISCARE_API_TOKEN, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY) were
  # verified absent from the entire build output and remain fully scanned
  # — this omits only the proven-non-secret, proven-server-only
  # values below, not scanning as a whole.
  #
  # SERVE_NOTIFICATION_REPLY_TO added after the c9f941e Deploy Preview
  # log identified it as the one remaining finding, flagged at
  # docs/architecture/AXISCARE_CLIENT_RECONCILIATION.md:49. Confirmed
  # from source (lib/notifications/channels/email.ts:40,48) that this
  # variable is used exclusively as an outbound email's `reply_to`
  # header via Resend's API — a plain email address for reply routing,
  # never passed to any auth call, never a token/key/credential. The
  # doc line documents that same real, non-secret staff email address
  # as a live-data example of AxisCare's `administrators[]` field — a
  # coincidental reuse of a real address, not a leaked credential.
  SECRETS_SCAN_OMIT_KEYS = "AXISCARE_API_BASE_URL,AXISCARE_SITE_NUMBER,SERVE_NOTIFICATION_REPLY_TO"
